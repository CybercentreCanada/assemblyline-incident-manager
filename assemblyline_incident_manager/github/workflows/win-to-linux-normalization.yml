name: win-to-linux-normalization

on:
  workflow_dispatch:

jobs:
  upload_windows:
    runs-on: windows-latest
    env:
      AL_URL: ${{ secrets.AL_URL }}
      AL_USER: ${{ secrets.AL_USER }}

      WRITE_KEY_PATH: ${{ runner.temp }}\Write.txt
      UPLOAD_BASE: ${{ env.USERPROFILE }}\Downloads\al_norm_test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Python (Windows)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (Windows)
        run: |
          py -3 -m pip install --upgrade pip
          py -3 -m pip install click assemblyline-client cart

      - name: Write API key to file
        shell: pwsh
        run: |
          Set-Content -Path "$env:WRITE_KEY_PATH" -Value "${{ secrets.AL_WRITE_KEY }}" -NoNewline

      - name: Create dataset (Windows)
        shell: pwsh
        run: |
          $UploadBase = "$env:UPLOAD_BASE"
          if (Test-Path $UploadBase) { Remove-Item -Recurse -Force $UploadBase }
          New-Item -ItemType Directory -Path "$UploadBase\a simple" | Out-Null
          New-Item -ItemType Directory -Path "$UploadBase\unicode\αβγ" -Force | Out-Null
          New-Item -ItemType Directory -Path "$UploadBase\deep\nested\structure\end" -Force | Out-Null
          New-Item -ItemType Directory -Path "$UploadBase\spaces and.dots." | Out-Null
          Set-Content "$UploadBase\a simple\duplicate.txt" -Value "dup content"
          Copy-Item   "$UploadBase\a simple\duplicate.txt" "$UploadBase\unicode\αβγ\duplicate.txt"
          Set-Content "$UploadBase\spaces and.dots.\file.name.with.dots.txt" -Value "dots"
          Set-Content "$UploadBase\deep\nested\structure\end\end.txt" -Value "deep"
          echo "Created dataset at $UploadBase"

      - name: Upload (Windows)
        shell: pwsh
        run: |
          $Incident = "norm-win-to-linux-$([int][double]::Parse((Get-Date -UFormat %s)))"
          echo "Incident=$Incident"
          py -3 al_incident_submitter.py `
            --url="$env:AL_URL" `
            --username="$env:AL_USER" `
            --apikey="$env:WRITE_KEY_PATH" `
            --classification="TLP:CLEAR" `
            --path="$env:UPLOAD_BASE" `
            --incident_num="$Incident" `
            --fresh
          # Save handoff data for Linux job
          $obj = @{ incident=$Incident; upload_base="$env:UPLOAD_BASE" }
          $json = $obj | ConvertTo-Json -Compress
          $out = "$env:RUNNER_TEMP\handoff.json"
          Set-Content $out $json -Encoding UTF8
          echo "Wrote $out"

      - name: Publish handoff
        uses: actions/upload-artifact@v4
        with:
          name: handoff
          path: ${{ runner.temp }}\handoff.json

  download_linux:
    runs-on: ubuntu-latest
    needs: upload_windows
    env:
      AL_URL: ${{ secrets.AL_URL }}
      AL_USER: ${{ secrets.AL_USER }}
      READ_KEY_PATH: ${{ runner.temp }}/Read.txt
      DLD: /tmp/al_norm_dld
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Python (Linux)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (Linux)
        run: |
          python -m pip install --upgrade pip
          python -m pip install click assemblyline-client cart

      - name: Write API key to file
        run: |
          printf '%s' "${{ secrets.AL_READ_KEY }}" > "$READ_KEY_PATH"

      - name: Download handoff artifact
        uses: actions/download-artifact@v4
        with:
          name: handoff
          path: ${{ runner.temp }}

      - name: Parse handoff
        id: handoff
        run: |
          HANDOFF="${{ runner.temp }}/handoff.json"
          echo "handoff=$HANDOFF"
          INCIDENT=$(jq -r '.incident' "$HANDOFF")
          UPLOAD_BASE_WIN=$(jq -r '.upload_base' "$HANDOFF")
          echo "incident=$INCIDENT" >> $GITHUB_OUTPUT
          echo "upload_base_win=$UPLOAD_BASE_WIN" >> $GITHUB_OUTPUT

      - name: Download (Linux)
        run: |
          rm -rf "$DLD" && mkdir -p "$DLD"
          python al_incident_downloader.py \
            --url="$AL_URL" \
            --username="$AL_USER" \
            --apikey="$READ_KEY_PATH" \
            --incident_num="${{ steps.handoff.outputs.incident }}" \
            --max_score=10000 \
            --download_path="$DLD" \
            --upload_path="${{ steps.handoff.outputs.upload_base_win }}"

      - name: Verify (Linux)
        run: |
          python - <<'PY'
          from pathlib import Path
          dld = Path("/tmp/al_norm_dld")
          expected = {
            "a simple/duplicate.txt": b"dup content",
            "unicode/αβγ/duplicate.txt": b"dup content",
            "spaces and.dots./file.name.with.dots.txt": b"dots",
            "deep/nested/structure/end/end.txt": b"deep",
          }
          missing, bad = [], []
          for rel, data in expected.items():
              p = dld / rel
              if not p.exists(): missing.append(str(p))
              elif p.read_bytes() != data: bad.append(str(p))
          if missing or bad:
              raise SystemExit(f"FAIL missing={missing} bad={bad}")
          print("PASS Win→Linux normalization")
          PY
